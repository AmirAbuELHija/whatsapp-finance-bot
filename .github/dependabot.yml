# Weekly, grouped updates: one PR per ecosystem instead of one per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node 22 LTS line; move to a new LTS deliberately, not via a bot PR.
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
