name: Deploy

# After CI passes on main, deploys the image CI built, scanned and pushed (only when the bot's code changed).
# By hand: rebuild the current commit, or roll back by pasting an earlier image.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: 'Roll back: full image reference to run (…/bot@sha256:…). Empty = build the current commit.'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ vars.GCP_IMAGE_REPO }}

jobs:
  resolve:
    name: Which image to deploy
    if: >-
      vars.GCP_IMAGE_REPO != '' && (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read # read the image digest CI published
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Image from the CI run
        if: github.event_name == 'workflow_run'
        continue-on-error: true # no artifact = the bot's code didn't change, nothing to deploy
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Pick
        id: pick
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "image=${INPUT_IMAGE:-build}" >> "$GITHUB_OUTPUT"
          elif [ -s image.txt ]; then
            image="$(cat image.txt)"
            # Only an image from our own registry, pinned by digest, may reach the VM.
            case "$image" in
              "${IMAGE_REPO}"@sha256:*) ;;
              *) echo "::error::Refusing to deploy '$image': not ${IMAGE_REPO}@sha256:…"; exit 1 ;;
            esac
            echo "image=${image}" >> "$GITHUB_OUTPUT"
            echo "Deploying ${image}"
          else
            echo "::notice::The bot's code didn't change in this merge; nothing to deploy."
          fi

  build:
    name: Build, scan & push
    # Only for a manual run without an image: CI already builds and pushes on main.
    needs: resolve
    if: needs.resolve.outputs.image == 'build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (blocks the deploy on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Push
        id: push
        run: |
          tag="${IMAGE_REPO}:${{ github.sha }}"
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          docker push "$tag"
          # Deploy by digest: exactly the bytes that were scanned.
          digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep -m1 "^${IMAGE_REPO}@sha256:" || true)"
          if [ -z "$digest" ]; then
            echo "::error::No registry digest for $tag after the push"
            exit 1
          fi
          echo "image=${digest}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to the VM
    needs: [resolve, build]
    if: >-
      always() && needs.resolve.outputs.image != '' &&
      (needs.resolve.outputs.image != 'build' || needs.build.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.resolve.outputs.image == 'build' && needs.build.outputs.image || needs.resolve.outputs.image }}
      INSTANCE: ${{ vars.GCP_INSTANCE }}
      ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Point the VM at the new image
        id: switch
        run: |
          previous="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --format=json \
            | jq -r '.metadata.items[]? | select(.key=="bot-image") | .value')"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Previous: ${previous:-none}"
          echo "New:      ${IMAGE}"
          if [ "$previous" = "$IMAGE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This exact image is already deployed; nothing to switch."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # The VM's deploy watcher sees this change and restarts the bot on the new image (no SSH).
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --metadata "bot-image=${IMAGE}"
      - name: Verify the new image started and reconnected to WhatsApp
        id: verify
        if: steps.switch.outputs.changed == 'true'
        run: |
          # "WhatsApp connected" is logged only when the bot (re)connects, so one after the switch means the
          # restart happened. Heartbeats from the old container don't count.
          since="${{ steps.switch.outputs.since }}"
          digest="${IMAGE##*@}"
          base="resource.type=\"gce_instance\" AND timestamp>=\"${since}\""
          for _ in $(seq 1 30); do
            sleep 10
            connected="$(gcloud logging read "${base} AND \"WhatsApp connected\"" --limit 1 --format='value(timestamp)')"
            if [ -n "$connected" ]; then
              started="$(gcloud logging read "${base} AND \"${digest}\"" --limit 1 --format='value(timestamp)')"
              echo "✅ Reconnected to WhatsApp at ${connected}${started:+ (new image started at ${started})}"
              exit 0
            fi
          done
          echo "::error::The bot did not reconnect to WhatsApp within 5 minutes of the switch"
          exit 1
      - name: Roll back to the previous image
        if: failure() && steps.switch.outputs.changed == 'true' && steps.switch.outputs.previous != ''
        run: |
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" \
            --metadata "bot-image=${{ steps.switch.outputs.previous }}"
          echo "::warning::Rolled back to ${{ steps.switch.outputs.previous }}"
