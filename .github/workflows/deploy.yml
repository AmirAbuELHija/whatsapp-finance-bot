name: Deploy

# Runs after CI passes on main, or by hand (also to roll back to an earlier image).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: 'Roll back: full image reference to run (…/bot@sha256:…). Empty = build the current commit.'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_REPO: ${{ vars.GCP_IMAGE_REPO }}

jobs:
  build:
    name: Build, scan & push
    # Skipped until infra/bootstrap.sh has created the cloud project and set the repository variables.
    if: >-
      vars.GCP_IMAGE_REPO != '' && (
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.image == ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_REPO }}:${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (blocks the deploy on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ github.event.workflow_run.head_sha || github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Push
        id: push
        run: |
          tag="${IMAGE_REPO}:${{ github.event.workflow_run.head_sha || github.sha }}"
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          docker push "$tag"
          # Deploy by digest: exactly the bytes that were scanned.
          echo "image=$(docker inspect --format='{{index .RepoDigests 0}}' "$tag")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to the VM
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image != ''))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ inputs.image || needs.build.outputs.image }}
      INSTANCE: ${{ vars.GCP_INSTANCE }}
      ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
      - name: Point the VM at the new image
        id: switch
        run: |
          previous="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --format=json \
            | jq -r '.metadata.items[]? | select(.key=="bot-image") | .value')"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"
          echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Previous: ${previous:-none}"
          echo "New:      ${IMAGE}"
          if [ "$previous" = "$IMAGE" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This exact image is already deployed; nothing to switch."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # The VM's deploy watcher sees this change and restarts the bot on the new image (no SSH).
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" --metadata "bot-image=${IMAGE}"
      - name: Verify the new image started and reconnected to WhatsApp
        id: verify
        if: steps.switch.outputs.changed == 'true'
        run: |
          # "WhatsApp connected" is logged only when the bot (re)connects, so one after the switch means the
          # restart happened. Heartbeats from the old container don't count.
          since="${{ steps.switch.outputs.since }}"
          digest="${IMAGE##*@}"
          base="resource.type=\"gce_instance\" AND timestamp>=\"${since}\""
          for _ in $(seq 1 30); do
            sleep 10
            connected="$(gcloud logging read "${base} AND \"WhatsApp connected\"" --limit 1 --format='value(timestamp)')"
            if [ -n "$connected" ]; then
              started="$(gcloud logging read "${base} AND \"${digest}\"" --limit 1 --format='value(timestamp)')"
              echo "✅ Reconnected to WhatsApp at ${connected}${started:+ (new image started at ${started})}"
              exit 0
            fi
          done
          echo "::error::The bot did not reconnect to WhatsApp within 5 minutes of the switch"
          exit 1
      - name: Roll back to the previous image
        if: failure() && steps.switch.outputs.changed == 'true' && steps.switch.outputs.previous != ''
        run: |
          gcloud compute instances add-metadata "$INSTANCE" --zone "$ZONE" \
            --metadata "bot-image=${{ steps.switch.outputs.previous }}"
          echo "::warning::Rolled back to ${{ steps.switch.outputs.previous }}"
