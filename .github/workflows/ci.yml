name: CI

# Pull requests: test, audit and scan. Main: the same, then (if the bot's code changed) push the scanned image
# once, so Deploy ships exactly what CI tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Production is Linux + Node 22. macOS/Windows/Node 24 run weekly in compat.yml.
        os: [ubuntu-latest]
        node: [22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build on high/critical issues in what we ship; dev tools are reported but don't block.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical

  shell:
    name: VM scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: shellcheck -x -P SCRIPTDIR -s bash infra/vm/*.sh infra/*.sh scripts/*.sh

  docker:
    name: Docker image builds and passes the vulnerability scan
    runs-on: ubuntu-latest
    needs: [quality, security]
    permissions:
      contents: read
      id-token: write # keyless push to Artifact Registry (main only; the deployer identity trusts only main)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Did the bot's code change?
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'Dockerfile'
              - '.dockerignore'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: whatsapp-finance-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-finance-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # ── Main only: publish the image that was just scanned, and hand its digest to Deploy ──
      - name: Should this image be published?
        id: publish
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && [ -n "${{ vars.GCP_IMAGE_REPO }}" ] && [ "${{ steps.changes.outputs.app }}" = "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing (pull request, docs/infra-only change, or cloud not set up)."
          fi
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        if: steps.publish.outputs.yes == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        if: steps.publish.outputs.yes == 'true'
      - name: Push the scanned image
        if: steps.publish.outputs.yes == 'true'
        env:
          IMAGE_REPO: ${{ vars.GCP_IMAGE_REPO }}
        run: |
          tag="${IMAGE_REPO}:${GITHUB_SHA}"
          docker tag whatsapp-finance-bot:ci "$tag"
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          docker push "$tag"
          # The image also has its local CI name, so pick the digest that belongs to the registry.
          digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep -m1 "^${IMAGE_REPO}@sha256:" || true)"
          if [ -z "$digest" ]; then
            echo "::error::No registry digest for $tag after the push"
            exit 1
          fi
          echo "$digest" > image.txt
          echo "Published $digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.publish.outputs.yes == 'true'
        with:
          name: image
          path: image.txt
          retention-days: 30
