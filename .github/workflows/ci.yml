name: CI

# Pull requests: test, audit and scan. Main: the same, then (if the bot's code changed) push the scanned image
# once, so Deploy ships exactly what CI tested.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Production is Linux + Node 22. macOS/Windows/Node 24 run weekly in compat.yml.
        os: [ubuntu-latest]
        node: [22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails the build on high/critical issues in what we ship; dev tools are reported but don't block.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=critical

  shell:
    name: VM scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -x -P SCRIPTDIR -s bash infra/vm/*.sh infra/*.sh scripts/*.sh

  docker:
    name: Docker image builds and passes the vulnerability scan
    runs-on: ubuntu-latest
    needs: [quality, security]
    permissions:
      contents: read
      id-token: write # keyless push to Artifact Registry (main only; the deployer identity trusts only main)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Did the bot's code change?
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'src/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'Dockerfile'
              - '.dockerignore'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: whatsapp-finance-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy image scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: whatsapp-finance-bot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      # ── Main only: publish the image that was just scanned, and hand its digest to Deploy ──
      - name: Should this image be published?
        id: publish
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && [ -n "${{ vars.GCP_IMAGE_REPO }}" ] && [ "${{ steps.changes.outputs.app }}" = "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not publishing (pull request, docs/infra-only change, or cloud not set up)."
          fi
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.publish.outputs.yes == 'true'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: steps.publish.outputs.yes == 'true'
      - name: Push the scanned image
        if: steps.publish.outputs.yes == 'true'
        env:
          IMAGE_REPO: ${{ vars.GCP_IMAGE_REPO }}
        run: |
          tag="${IMAGE_REPO}:${GITHUB_SHA}"
          docker tag whatsapp-finance-bot:ci "$tag"
          gcloud auth configure-docker "${IMAGE_REPO%%/*}" --quiet
          docker push "$tag"
          # The image also has its local CI name, so pick the digest that belongs to the registry.
          digest="$(docker inspect --format='{{range .RepoDigests}}{{println .}}{{end}}' "$tag" | grep -m1 "^${IMAGE_REPO}@sha256:" || true)"
          if [ -z "$digest" ]; then
            echo "::error::No registry digest for $tag after the push"
            exit 1
          fi
          echo "$digest" > image.txt
          echo "Published $digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.publish.outputs.yes == 'true'
        with:
          name: image
          path: image.txt
          retention-days: 30
