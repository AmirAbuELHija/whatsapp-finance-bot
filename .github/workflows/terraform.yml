name: Terraform

on:
  pull_request:
    paths: ['infra/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/terraform.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false # never interrupt a running apply

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_zone: ${{ vars.GCP_ZONE }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_admin_members: ${{ vars.TF_ADMIN_MEMBERS || '[]' }}

defaults:
  run:
    working-directory: infra/terraform

jobs:
  plan:
    name: Validate & plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless sign-in to Google Cloud
      pull-requests: write # plan summary as a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init && tflint --recursive
        env:
          GITHUB_TOKEN: ${{ github.token }} # plugin download without hitting the anonymous API rate limit
      - name: Validate (no cloud access needed)
        run: terraform init -backend=false && terraform validate
      # The steps below need the Google Cloud project (run infra/bootstrap.sh once to create the variables).
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: vars.GCP_WIF_PROVIDER != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLANNER_SA }} # read-only
      - if: vars.GCP_WIF_PROVIDER != ''
        run: terraform init -reconfigure -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: Plan (read-only, no state lock)
        if: vars.GCP_WIF_PROVIDER != ''
        run: set -o pipefail; terraform plan -lock=false -no-color -out=tfplan | tee plan.txt
      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request' && vars.GCP_WIF_PROVIDER != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/terraform/plan.txt', 'utf8');
            const summary = plan.split('\n').filter((l) => /^Plan:|No changes/.test(l)).join('\n') || 'See the job log';
            const body = `### Terraform plan\n\`${summary}\`\n<details><summary>Full plan</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    name: Apply (needs approval)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GCP_WIF_PROVIDER != ''
    needs: plan
    runs-on: ubuntu-latest
    environment: production # Settings → Environments → production → Required reviewers
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APPLIER_SA }} # only usable from main
      - run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -auto-approve
